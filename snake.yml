name: Generate snake

on:
  schedule:
    - cron: "37 18 * * *"   # daily, just after midnight IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f2328
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e6edf3

      - name: Replace bottom bar with line + dot
        run: python3 snake_bar.py dist/github-snake.svg dist/github-snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
