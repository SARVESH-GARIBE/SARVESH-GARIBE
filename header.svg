<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 820 300" width="820" height="300">
  <style>
    .bg { fill: #0d1117; stroke: #21262d; }
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .dim { fill: #484f58; }
    .p { fill: #7ee787; }
    .t { fill: #c9d1d9; }
    .a { fill: #79c0ff; }
    .big { font-size: 26px; font-weight: 600; fill: #e6edf3; letter-spacing: 1px; }
    .l { opacity: 0; animation: in .01s forwards; }
    .l1 { animation-delay: .3s } .l2 { animation-delay: .9s } .l3 { animation-delay: 1.5s }
    .l4 { animation-delay: 2.1s } .l5 { animation-delay: 2.7s } .l6 { animation-delay: 3.3s }
    .l7 { animation-delay: 3.9s }
    @keyframes in { to { opacity: 1 } }
    .cur { fill: #7ee787; animation: blink 1.1s 3.9s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0 } }
    .dot { fill: #21262d; }
    .scan { fill: url(#g); opacity: .05; animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-60px) } to { transform: translateY(320px) } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.6" fill="#21262d"/></pattern>
    <clipPath id="c"><rect x="0.5" y="0.5" width="819" height="299" rx="10"/></clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="819" height="299" rx="10"/>
  <g clip-path="url(#c)"><rect class="scan" x="0" y="0" width="820" height="60"/></g>

  <rect x="552" y="92" width="240" height="180" fill="url(#dots)"/>
  <text x="28" y="34" class="dim">kizuki · tty1</text>
  <text x="792" y="34" class="dim" text-anchor="end">SARVESH-GARIBE</text>
  <line x1="28" y1="48" x2="792" y2="48" stroke="#21262d"/>

  <text x="28" y="92" class="big l l1">sarvesh garibe</text>

  <text x="28" y="132" class="l l2"><tspan class="p">~ $</tspan><tspan class="t"> whoami</tspan></text>
  <text x="28" y="154" class="t l l3">full-stack developer. final year cse.</text>

  <text x="28" y="190" class="l l4"><tspan class="p">~ $</tspan><tspan class="t"> ls ./stack</tspan></text>
  <text x="28" y="212" class="a l l5">python   react   next.js   django   docker   linux</text>

  <text x="28" y="248" class="l l6"><tspan class="p">~ $</tspan><tspan class="t"> echo $STATUS</tspan></text>
  <text x="28" y="270" class="t l l7">open to collaborate <tspan class="cur">█</tspan></text>
</svg>
