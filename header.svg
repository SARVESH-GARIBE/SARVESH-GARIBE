<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 820 280" width="820" height="280">
  <style>
    text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dim { fill: #484f58; font-size: 12px; letter-spacing: 1px; }
    .name { font-size: 40px; font-weight: 700; letter-spacing: 6px; fill: url(#shine); }
    .gt { fill: #7ee787; font-size: 16px; }
    .role { fill: #c9d1d9; font-size: 16px; opacity: 0; animation: role 9s infinite; }
    .r2 { animation-delay: 3s } .r3 { animation-delay: 6s }
    @keyframes role { 0% {opacity:0} 4% {opacity:1} 30% {opacity:1} 34% {opacity:0} 100% {opacity:0} }
    .cur { fill: #7ee787; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0 } }
    .lbl { fill: #484f58; font-size: 11px; letter-spacing: 2px; }
    .val { fill: #c9d1d9; font-size: 13px; }
    .acc { fill: #79c0ff; font-size: 13px; }
    .bar { fill: #161b22; }
    .seg { fill: #7ee787; }
    .segt { fill: #0d1117; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .st { fill: #8b949e; font-size: 11px; }
    .on { fill: #7ee787; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { fill-opacity: .25 } }
  </style>
  <defs>
    <linearGradient id="shine" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset=".45" stop-color="#e6edf3"/>
      <stop offset=".5" stop-color="#7ee787"/>
      <stop offset=".55" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#e6edf3"/>
      <animate attributeName="x1" values="-1;1;1" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;2" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.3" fill="#1c2128"/></pattern>
    <clipPath id="c"><rect x="0.5" y="0.5" width="819" height="279" rx="12"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="279" rx="12" fill="#0d1117" stroke="#21262d"/>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="820" height="280" fill="url(#dots)"/>
    <rect x="0" y="0" width="820" height="280" fill="#0d1117" opacity=".55"/>
  </g>

  <text x="36" y="40" class="dim">~/sarvesh</text>
  <text x="784" y="40" class="dim" text-anchor="end">UTC+05:30</text>

  <text x="34" y="100" class="name">SARVESH GARIBE</text>

  <text x="36" y="134" class="gt">&gt;</text>
  <text x="56" y="134" class="role r1">full-stack developer<tspan class="cur"> _</tspan></text>
  <text x="56" y="134" class="role r2">builds apis &amp; web apps<tspan class="cur"> _</tspan></text>
  <text x="56" y="134" class="role r3">lives in the linux terminal<tspan class="cur"> _</tspan></text>

  <line x1="36" y1="162" x2="784" y2="162" stroke="#21262d"/>

  <text x="36" y="190" class="lbl">BUILD</text>
  <text x="36" y="210" class="val">apis · web apps · ai tools</text>

  <text x="300" y="190" class="lbl">STACK</text>
  <text x="300" y="210" class="acc">python · react · next.js · django</text>

  <text x="600" y="190" class="lbl">NOW</text>
  <text x="600" y="210" class="val">final year cse</text>

  <g clip-path="url(#c)">
    <rect x="0" y="246" width="820" height="34" class="bar"/>
    <rect x="0" y="246" width="96" height="34" class="seg"/>
  </g>
  <text x="18" y="267" class="segt">SARVESH</text>
  <text x="112" y="267" class="st">0:zsh*   1:code   2:docker</text>
  <circle cx="676" cy="263" r="4" class="on"/>
  <text x="688" y="267" class="st">open to work</text>
</svg>
